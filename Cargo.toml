[workspace]
resolver = "3"
members = ["crates/sim-core", "crates/sim-brain", "crates/sim-proto", "apps/sim-server", "apps/sim-headless"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
sim-core = { path = "crates/sim-core" }
sim-proto = { path = "crates/sim-proto" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
glam = { version = "0.34", default-features = false, features = ["std", "libm", "serde", "i32", "u32"] }
rand_pcg = { version = "0.10", features = ["serde"] }
rand_core = "0.10"
rayon = "1.12"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
libm = "0.2"
thiserror = "2"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["fs"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"

[profile.dev.package."*"]
opt-level = 2
